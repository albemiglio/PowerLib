# Read by SonarCloud Automatic Analysis (the CI build configures the same values via the pom).
sonar.projectKey=AlbeMiglio_PowerLib
sonar.organization=albemiglio

# Copy-paste detection exclusions — not real duplication debt:
#  - it.mycraft.powerlib.configuration is a @Deprecated mirror of common.configuration,
#    kept only for backwards compatibility;
#  - the per-platform updater/scheduler/audience adapters share a shape but target three
#    different platform APIs (Bukkit/Bungee/Velocity).
sonar.cpd.exclusions=**/powerlib/configuration/**,**/PluginUpdater.java,**/*Scheduler.java,**/*AudienceProvider.java
