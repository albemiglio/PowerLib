# Build/test sanity check + SonarCloud analysis on every push & PR. Publishing is
# handled by release.yml, on version tags.

name: Build

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Shallow clones disable Sonar's "new code" / blame detection.
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Build, test and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar --file pom.xml \
            -Dsonar.cpd.exclusions='**/powerlib/configuration/**,**/PluginUpdater.java,**/*Scheduler.java,**/*AudienceProvider.java'
        else
          echo "SONAR_TOKEN not set - skipping SonarCloud analysis, running build + tests + coverage only."
          mvn -B verify --file pom.xml
        fi

    # The standalone plugins shade the platform modules, and the platform implementations are
    # found through ServiceLoader: a shade filter that drops META-INF/services produces a jar
    # that loads but does nothing, with no error anywhere. Fail the build instead.
    - name: Check the shaded plugin jars keep their service descriptors
      run: |
        missing=0
        for platform in bukkit bungee velocity; do
          jar=$(ls "$platform-plugin"/target/powerlib-"$platform"-plugin-*.jar | grep -v -- '-javadoc\|-sources' | head -1)
          for service in chat.AudienceProvider scheduler.PowerScheduler messaging.MessageTransport; do
            entry="META-INF/services/it.mycraft.powerlib.common.$service"
            if unzip -l "$jar" | grep -q "$entry"; then
              echo "ok      $platform  $entry"
            else
              echo "MISSING $platform  $entry  (in $jar)"
              missing=1
            fi
          done
        done
        exit $missing

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: powerlib-jars
        path: '*/target/*.jar'
        if-no-files-found: warn
        retention-days: 5
