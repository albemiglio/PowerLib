# Build/test sanity check + SonarCloud analysis on every push & PR. Publishing
# to CodeMC is handled by the CodeMC Jenkins job
# (ci.codemc.io/job/AlbeMiglio/job/PowerLib), not here.

name: Build

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Shallow clones disable Sonar's "new code" / blame detection.
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Build, test and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar --file pom.xml \
            -Dsonar.cpd.exclusions='**/powerlib/configuration/**,**/PluginUpdater.java,**/*Scheduler.java,**/*AudienceProvider.java'
        else
          echo "SONAR_TOKEN not set - skipping SonarCloud analysis, running build + tests + coverage only."
          mvn -B verify --file pom.xml
        fi

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: powerlib-jars
        path: '*/target/*.jar'
        if-no-files-found: warn
        retention-days: 5
