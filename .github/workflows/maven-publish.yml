# Build/test sanity check on every push & PR. Publishing to CodeMC is handled
# by the CodeMC Jenkins job (ci.codemc.io/job/AlbeMiglio/job/PowerLib), not here.

name: Build

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: powerlib-jars
        path: '*/target/*.jar'
        if-no-files-found: warn
        retention-days: 5
