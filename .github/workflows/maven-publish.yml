# Builds PowerLib with Maven on every push/PR and deploys to CodeMC on release.

name: Maven Package

on:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        # Must match the distributionManagement repository id in pom.xml.
        server-id: codemc-releases
        server-username: CODEMC_USERNAME
        server-password: CODEMC_PASSWORD

    - name: Build with Maven
      run: mvn -B -DskipTests package --file pom.xml

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: powerlib-jars
        path: '*/target/*.jar'
        if-no-files-found: warn
        retention-days: 5

    - name: Publish to CodeMC
      if: github.event_name == 'release'
      run: mvn -B -DskipTests deploy
      env:
        CODEMC_USERNAME: ${{ secrets.CODEMC_USERNAME }}
        CODEMC_PASSWORD: ${{ secrets.CODEMC_PASSWORD }}
