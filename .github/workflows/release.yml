# Publishes every PowerLib module (it.mycraft:powerlib-*) on each version tag — fully automatic,
# no manual step. The published version is taken from the tag (tag 1.4.0 -> artifacts 1.4.0), so no
# pom edit is needed to cut a release: just push a X.Y.Z tag.
#
# Three destinations, each independent; a destination whose credentials are not configured is
# skipped with a message instead of failing the run:
#   * GitHub Packages  — always, with the built-in GITHUB_TOKEN.
#                        https://maven.pkg.github.com/albemiglio/PowerLib
#   * CodeMC           — the public distribution channel already declared in the root pom.
#                        Needs the CODEMC_USERNAME / CODEMC_PASSWORD secrets.
#   * a private repo   — optional, for consumers outside the public channel.
#                        Needs MAVEN_PRIVATE_URL / MAVEN_PRIVATE_USER / MAVEN_PRIVATE_PASS.
name: Release

on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17 (+ github server for Maven)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: github
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD

    - name: Set the version from the tag
      if: github.ref_type == 'tag'
      run: >-
        ./mvnw -B -ntp versions:set
        -DnewVersion=${{ github.ref_name }}
        -DprocessAllModules -DgenerateBackupPoms=false

    - name: Deploy all modules to GitHub Packages
      env:
        MAVEN_USERNAME: ${{ github.actor }}
        MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./mvnw -B -ntp -DskipTests -Dmaven.javadoc.skip=true \
          deploy -DaltDeploymentRepository=github::https://maven.pkg.github.com/albemiglio/PowerLib

    # setup-java writes settings.xml for one server-id at a time, so each further destination
    # regenerates it with its own credentials.
    - name: Set up Maven server for CodeMC
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: codemc-releases
        server-username: CODEMC_USERNAME
        server-password: CODEMC_PASSWORD

    - name: Deploy all modules to CodeMC
      env:
        CODEMC_USERNAME: ${{ secrets.CODEMC_USERNAME }}
        CODEMC_PASSWORD: ${{ secrets.CODEMC_PASSWORD }}
      run: |
        if [ -z "$CODEMC_USERNAME" ] || [ -z "$CODEMC_PASSWORD" ]; then
          echo "CodeMC credentials not configured (CODEMC_USERNAME / CODEMC_PASSWORD) - skipping."
          exit 0
        fi
        ./mvnw -B -ntp -DskipTests -Dmaven.javadoc.skip=true \
          deploy -DaltDeploymentRepository=codemc-releases::https://repo.codemc.io/repository/maven-releases/

    - name: Set up Maven server for the private repository
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: private-releases
        server-username: PRIVATE_USERNAME
        server-password: PRIVATE_PASSWORD

    - name: Deploy all modules to the private repository
      env:
        PRIVATE_USERNAME: ${{ secrets.MAVEN_PRIVATE_USER }}
        PRIVATE_PASSWORD: ${{ secrets.MAVEN_PRIVATE_PASS }}
        PRIVATE_URL: ${{ secrets.MAVEN_PRIVATE_URL }}
      run: |
        if [ -z "$PRIVATE_URL" ] || [ -z "$PRIVATE_USERNAME" ]; then
          echo "Private Maven repository not configured - skipping."
          exit 0
        fi
        ./mvnw -B -ntp -DskipTests -Dmaven.javadoc.skip=true \
          deploy -DaltDeploymentRepository=private-releases::"$PRIVATE_URL"
